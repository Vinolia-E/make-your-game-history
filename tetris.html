<head>
    <link rel="stylesheet" href="/styles/styles.css">
</head>


<body>
    <div class="game-wrapper">
        <div id="game-container"></div>
        
        <div id="info-panel">
            <div class="game-title">TETRIS</div>
            
            <div class="info-section">
                <div class="info-label">Score</div>
                <div class="info-value" id="score">0</div>
            </div>
            
            <div class="info-section">
                <div class="info-label">Time</div>
                <div class="info-value" id="timer">0:00</div>
            </div>
            
            <div class="info-section">
                <div class="info-label">Lives</div>
                <div class="info-value" id="lives">3</div>
            </div>

            <div class="controls-info">
                <div class="controls-title">Controls</div>
                <div class="control-item">
                    <span>Move Left</span>
                    <span>←</span>
                </div>
                <div class="control-item">
                    <span>Move Right</span>
                    <span>→</span>
                </div>
                <div class="control-item">
                    <span>Rotate</span>
                    <span>↑</span>
                </div>
                <div class="control-item">
                    <span>Drop</span>
                    <span>↓</span>
                </div>
                <div class="control-item">
                    <span>Pause</span>
                    <span>Space Bar</span>
                </div>
            </div>
        </div>

        <div id="pause-menu"> 
            <button id="continue" class="menu-button">Continue</button>
            <button id="restart" class="menu-button">Restart</button>
        </div>
    </div>
</body>
