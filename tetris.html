<head>
    <link rel="stylesheet" href="styles/styles.css">
</head>


<body>
    <div class="game-wrapper">
        <div id="game-container"></div>
        
        <div id="info-panel">
            <div class="game-title">Player Stats</div>

            <div class="info-section">
                <div class="info-label">Score</div>
                <div class="info-value" id="score">0</div>
            </div>
            
            <div class="info-section">
                <div class="info-label">Time</div>
                <div class="info-value" id="timer">0:00</div>
            </div>
            
            <div class="info-section">
                <div class="info-label">Lives</div>
                <div class="info-value" id="lives">3</div>
            </div>

            <div class="info-section">
                <div class="info-label">Live Scoreboard</div>
                <div id="live-scoreboard" class="scoreboard-mini">
                    <!-- Scores will be inserted here -->
                </div>
            </div>

            <div class="controls-info">
                <div class="controls-title">Controls</div>
                <div class="control-item">
                    <span>Move Left</span>
                    <span>←</span>
                </div>
                <div class="control-item">
                    <span>Move Right</span>
                    <span>→</span>
                </div> 
                <div class="control-item">
                    <span>Rotate</span>
                    <span>↑</span>
                </div>
                <div class="control-item">
                    <span>Drop</span>
                    <span>↓</span>
                </div>
                <div class="control-item">
                    <span>Restart</span>
                    <span>R</span>
                </div>
                <div class="control-item">
                    <span>Pause/Continue</span>
                    <span>Space Bar</span>
                </div>
            </div>
        </div>

        <div id="pause-menu"> 
            <!-- <div id="storyTeller" class="storyTime" style="display: none;"></div> -->
            <button id="continue" class="menu-button">Continue (Space Bar)</button>
            <button id="restart" class="menu-button">Press R to restart</button>
        </div>
    </div>
    <script src="js/checkLines.js"></script>
    <script src="js/collide.js"></script>
    <script src="js/continue.js"></script>
    <script src="js/createGrid.js"></script>
    <script src="js/createPiece.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/drawBlock.js"></script>
    <script src="js/gameOver.js"></script>
    <script src="js/handleKeyPress.js"></script>
    <script src="js/initGame.js"></script>
    <script src="js/merge.js"></script>
    <script src="js/movePiece.js"></script>
    <script src="js/restart.js"></script>
    <script src="js/rotatePiece.js"></script>
    <script src="js/setupControls.js"></script>
    <script src="js/togglePause.js"></script>
    <script src="js/update.js"></script>
    <script src="js/updateUI.js"></script>
    <script src="js/variables.js"></script>
    <script src="js/story.js"></script>
</body>
